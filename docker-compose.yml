version: "3.9"

services:

  postgres:
    image: pgvector/pgvector:pg16
    container_name: agentflow_postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: agentflow

    ports:
      - "5432:5432"

  redis:
    image: redis:latest
    container_name: agentflow_redis

    ports:
      - "6379:6379"